<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Progress — Parent Report</title>
<style>
  .viz-root{
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --surface-2:      #f2f2f0;
    --border:         #e2e2de;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #7a7975;
    --series-1:       #2a78d6;   /* Jackson */
    --series-2:       #eb6834;   /* Miles */
    --grid:           #e8e8e4;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])) .viz-root{
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --surface-2:      #232322;
      --border:         #35352f;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e85;
      --series-1:       #3987e5;
      --series-2:       #d95926;
      --grid:           #2c2c28;
    }
  }
  :root[data-theme="dark"] .viz-root{
    color-scheme: dark;
    --surface-1:#1a1a19; --surface-2:#232322; --border:#35352f;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#8f8e85;
    --series-1:#3987e5; --series-2:#d95926; --grid:#2c2c28;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--surface-2); color:var(--text-primary);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    font-size:15px; line-height:1.5;
  }
  .page{ max-width:760px; margin:0 auto; padding:28px 20px 60px; }
  header{ margin-bottom:8px; }
  h1{ font-size:26px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub{ color:var(--text-secondary); font-size:14px; margin:0 0 24px; }

  .card{
    background:var(--surface-1); border:1px solid var(--border);
    border-radius:12px; padding:20px 22px; margin-bottom:18px;
  }
  .kidHead{ display:flex; align-items:baseline; gap:10px; margin:0 0 2px; }
  .kidHead h2{ font-size:19px; margin:0; }
  .swatch{ width:11px; height:11px; border-radius:3px; flex:none; align-self:center; }
  .kidHead .game{ color:var(--text-muted); font-size:13px; }

  /* hero number */
  .hero{ display:flex; align-items:baseline; gap:12px; margin:14px 0 2px; }
  .hero .big{ font-size:42px; font-weight:650; letter-spacing:-0.02em; line-height:1; }
  .hero .delta{ font-size:14px; font-weight:600; }
  .up{ color:#008300; } .down{ color:#c0392b; } .flat{ color:var(--text-muted); }
  .heroLabel{ color:var(--text-secondary); font-size:13px; margin-bottom:18px; }

  /* stat row */
  .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:1px;
          background:var(--border); border:1px solid var(--border); border-radius:9px;
          overflow:hidden; margin:16px 0 22px; }
  .stat{ background:var(--surface-1); padding:11px 13px; }
  .stat .v{ font-size:19px; font-weight:650; letter-spacing:-0.01em; }
  .stat .k{ font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }

  /* chart */
  .chartTitle{ font-size:13px; font-weight:600; color:var(--text-secondary); margin:0 0 12px; }
  .chart{ position:relative; height:132px; display:flex; align-items:flex-end; gap:6px;
          border-bottom:1px solid var(--grid); padding-bottom:0; }
  .bar{ flex:1 1 0; min-width:0; position:relative; display:flex; flex-direction:column;
        justify-content:flex-end; align-items:center; height:100%; cursor:default; }
  .bar .fill{ width:100%; border-radius:4px 4px 0 0; background:var(--series-1); }
  .bar.miles .fill{ background:var(--series-2); }
  .bar .lab{ position:absolute; top:-2px; font-size:10px; color:var(--text-secondary);
             font-weight:600; width:100%; text-align:center; }
  .axis{ display:flex; gap:6px; margin-top:6px; }
  .axis span{ flex:1 1 0; min-width:0; text-align:center; font-size:10px; color:var(--text-muted);
              overflow:hidden; white-space:nowrap; }
  .gridline{ position:absolute; left:0; right:0; border-top:1px dashed var(--grid);
             font-size:10px; color:var(--text-muted); }
  .gridline span{ position:absolute; right:0; top:-14px; background:var(--surface-1); padding-left:5px; }

  #tip{
    position:fixed; pointer-events:none; z-index:50; opacity:0; transition:opacity .1s;
    background:var(--text-primary); color:var(--surface-1); font-size:12px; line-height:1.4;
    padding:7px 10px; border-radius:7px; max-width:220px; white-space:nowrap;
  }

  /* practice list */
  .practice{ margin-top:6px; }
  .practice h3{ font-size:13px; font-weight:600; color:var(--text-secondary); margin:20px 0 8px; }
  .facts{ display:flex; flex-wrap:wrap; gap:7px; }
  .fact{ background:var(--surface-2); border:1px solid var(--border); border-radius:7px;
         padding:6px 11px; font-size:14px; font-variant-numeric:tabular-nums; }
  .fact b{ font-weight:650; }
  .fact i{ font-style:normal; color:var(--text-muted); font-size:12px; margin-left:6px; }

  details{ margin-top:18px; border-top:1px solid var(--border); padding-top:12px; }
  summary{ cursor:pointer; font-size:13px; color:var(--text-secondary); }
  table{ border-collapse:collapse; width:100%; margin-top:10px; font-size:13px; }
  th,td{ text-align:left; padding:6px 8px; border-bottom:1px solid var(--border);
         font-variant-numeric:tabular-nums; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); font-weight:600; }

  .actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
  .btn{
    border:1px solid var(--border); background:var(--surface-1); color:var(--text-primary);
    font:inherit; font-size:14px; font-weight:550; padding:10px 18px; border-radius:8px; cursor:pointer;
  }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--series-1); border-color:var(--series-1); color:#fff; }
  .btn.primary:hover{ filter:brightness(1.08); }
  .note{ color:var(--text-muted); font-size:12.5px; margin-top:12px; line-height:1.55; }
  .empty{ color:var(--text-secondary); font-size:14px; padding:6px 0 2px; }
  .empty b{ color:var(--text-primary); }
  a.back{ color:var(--text-secondary); font-size:13px; text-decoration:none; }
  a.back:hover{ text-decoration:underline; }
  @media print{ .actions,.back{ display:none; } body{ background:#fff; } }
</style>
</head>
<body class="viz-root">
<div class="page">
  <a class="back" href="../index.html">&larr; Back to the Arcade</a>
  <header>
    <h1>Arcade Progress</h1>
    <p class="sub" id="sub">Reading what's saved in this browser…</p>
  </header>

  <div id="report"></div>

  <div class="card">
    <div class="actions">
      <button class="btn primary" id="emailBtn">Email this to me</button>
      <button class="btn" id="copyBtn">Copy as text</button>
      <button class="btn" id="printBtn">Print / Save PDF</button>
    </div>
    <p class="note" id="note"></p>
  </div>
</div>
<div id="tip"></div>

<script>
/* =====================================================================
   PARENT REPORT
   Reads what the two games saved in this browser. No server, no account,
   nothing leaves the machine unless you press the email button.
   ===================================================================== */
const PARENT_EMAIL = 'ajl5102@gmail.com';   // change this to send the report elsewhere
const RECENT_N     = 5;                     // sessions averaged for the headline number
const CHART_N      = 10;                    // sessions shown in the bar chart

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
};
const json = (k, fallback) => {
  try { return JSON.parse(store.get(k) || 'null') ?? fallback; }
  catch(e){ return fallback; }
};

const KIDS = [
  { who:'Jackson', game:'Math Defender', slug:'mathdefender', cls:'',
    topics:{ times:'Times Tables', mixed:'Mixed Mode' },
    modes:{ sprint:'Sprint', blitz:'Blitz' }, unit:{ sprint:'s', blitz:' right' } },
  { who:'Miles', game:'Coin Climb', slug:'coinclimb', cls:'miles',
    topics:{ addsub:'Add & Subtract', count:'Count & Compare' },
    modes:{ sprint:'Race', blitz:'Coin Rush' }, unit:{ sprint:'s', blitz:' coins' } },
];

const sessions = json('arcade.v1.sessions', []);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayLabel = t => new Date(t).toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
const fullDate = t => new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;

/* ---- pretty-print a fact id ("7x8" -> "7 × 8", "15-6" -> "15 − 6") ---- */
const KIND_NAMES = {
  mul:'Multiplying', div:'Dividing', add:'Adding big numbers', sub:'Subtracting big numbers',
  skip2:'Counting by 2s', skip5:'Counting by 5s', skip10:'Counting by 10s',
  after:'What comes after', before:'What comes before',
  biggest:'Which is biggest', smallest:'Which is smallest'
};
function prettyFact(id){
  if (KIND_NAMES[id]) return KIND_NAMES[id];
  if (id.includes('x')) return id.replace('x',' × ');
  if (id.includes('+')) return id.replace('+',' + ');
  if (/^\d+-\d+$/.test(id)) return id.replace('-',' − ');
  return id;
}

/* ---- build one kid's numbers ---------------------------------------- */
function summarise(kid){
  const mine  = sessions.filter(s => s.who === kid.who).sort((a,b)=>a.t-b.t);
  const facts = json(kid.slug + '.v1.facts', {});
  const practice = Object.entries(facts)
    .filter(([,r]) => r && r.w > 0)
    .sort((a,b) => b[1].w - a[1].w || b[1].m - a[1].m)
    .slice(0,6)
    .map(([id,r]) => ({ id, misses:r.m||0, seen:r.n||0 }));
  const tracked  = Object.keys(facts).length;
  const mastered = Object.values(facts).filter(r => r && r.w === 0 && r.n >= 2).length;

  const recent = mine.slice(-RECENT_N);
  const prior  = mine.slice(-RECENT_N*2, -RECENT_N);
  const recentAcc = avg(recent.map(s=>s.acc));
  const priorAcc  = avg(prior.map(s=>s.acc));

  const records = [];
  for (const [tk,tn] of Object.entries(kid.topics))
    for (const [mk,mn] of Object.entries(kid.modes)){
      const raw = store.get(`${kid.slug}.v1.${tk}.${mk}`);
      if (raw !== null) records.push({ label:`${tn} · ${mn}`, value:parseFloat(raw)+kid.unit[mk] });
    }

  return {
    kid, sessions:mine, facts, practice, tracked, mastered, records,
    recentAcc, priorAcc,
    totalQ: mine.reduce((n,s)=>n+(s.correct||0)+(s.wrong||0), 0),
    comebacks: mine.reduce((n,s)=>n+(s.comebacks||0), 0),
    last: mine.length ? mine[mine.length-1].t : null,
  };
}

/* ---- render ---------------------------------------------------------- */
function bars(d){
  const shown = d.sessions.slice(-CHART_N);
  if (!shown.length) return '';
  // label the first, last, best and worst only — a number on every bar is noise
  const accs = shown.map(s=>s.acc);
  const keep = new Set([0, shown.length-1, accs.indexOf(Math.max(...accs)), accs.indexOf(Math.min(...accs))]);
  const rows = shown.map((s,i) => {
    const h = Math.max(2, s.acc);                       // 0–100% maps straight to height
    const label = keep.has(i) ? `<span class="lab">${s.acc}%</span>` : '';
    const tip = `${fullDate(s.t)} · ${esc(s.topic)} ${esc(d.kid.modes[s.mode]||s.mode)}\n`
              + `${s.correct} right, ${s.wrong} wrong (${s.acc}%)`;
    return `<div class="bar ${d.kid.cls}" data-tip="${esc(tip)}">
              ${label}<div class="fill" style="height:${h}%"></div>
            </div>`;
  }).join('');
  const axis = shown.map(s=>`<span>${dayLabel(s.t)}</span>`).join('');
  return `
    <p class="chartTitle">Accuracy per session — last ${shown.length}
      <span style="font-weight:400;color:var(--text-muted)">· hover a bar for detail</span></p>
    <div class="chart">
      <div class="gridline" style="bottom:100%"><span>100%</span></div>
      ${rows}
    </div>
    <div class="axis">${axis}</div>`;
}

function deltaHtml(d){
  if (d.recentAcc === null) return '';
  if (d.priorAcc === null) return `<span class="delta flat">no earlier sessions to compare yet</span>`;
  const diff = Math.round(d.recentAcc - d.priorAcc);
  if (diff > 1)  return `<span class="delta up">▲ ${diff} pts vs the ${RECENT_N} before</span>`;
  if (diff < -1) return `<span class="delta down">▼ ${Math.abs(diff)} pts vs the ${RECENT_N} before</span>`;
  return `<span class="delta flat">about the same as the ${RECENT_N} before</span>`;
}

function card(d){
  const k = d.kid;
  const colour = k.cls === 'miles' ? 'var(--series-2)' : 'var(--series-1)';
  const head = `<div class="kidHead"><span class="swatch" style="background:${colour}"></span>
                  <h2>${k.who}</h2><span class="game">${k.game}</span></div>`;

  if (!d.sessions.length){
    return `<div class="card">${head}
      <p class="empty">No finished games yet. Scores appear here once <b>${k.who}</b> plays a
      round all the way to the end on this computer.</p></div>`;
  }

  const stats = [
    ['Sessions', d.sessions.length],
    ['Questions', d.totalQ],
    ['Mastered', d.mastered],
    ['Comebacks', d.comebacks],
    ['Last played', fullDate(d.last)],
  ].map(([kk,v]) => `<div class="stat"><div class="v">${v}</div><div class="k">${kk}</div></div>`).join('');

  const recs = d.records.length
    ? `<h3>Personal bests</h3><div class="facts">` +
      d.records.map(r=>`<span class="fact">${esc(r.label)} <b>${esc(r.value)}</b></span>`).join('') +
      `</div>`
    : '';

  const prac = d.practice.length
    ? `<h3>Working on these</h3><div class="facts">` +
      d.practice.map(p=>`<span class="fact"><b>${esc(prettyFact(p.id))}</b><i>${p.misses} miss${p.misses===1?'':'es'}</i></span>`).join('') +
      `</div><p class="note">The game shows these more often than the rest — but only about
       a third of questions, so a round never turns into all hard stuff.</p>`
    : `<h3>Working on these</h3><p class="empty">Nothing on the practice list — everything
       missed recently has been answered correctly since.</p>`;

  const table = `<details><summary>All ${d.sessions.length} sessions</summary>
    <table><thead><tr><th>Date</th><th>What</th><th>Right</th><th>Wrong</th><th>Accuracy</th></tr></thead>
    <tbody>${d.sessions.slice().reverse().map(s=>`<tr>
      <td>${fullDate(s.t)}</td><td>${esc(s.topic)} · ${esc(k.modes[s.mode]||s.mode)}</td>
      <td>${s.correct}</td><td>${s.wrong}</td><td>${s.acc}%</td></tr>`).join('')}
    </tbody></table></details>`;

  return `<div class="card">${head}
    <div class="hero"><span class="big">${Math.round(d.recentAcc)}%</span>${deltaHtml(d)}</div>
    <div class="heroLabel">accuracy across his last ${Math.min(RECENT_N,d.sessions.length)} session${d.sessions.length===1?'':'s'}</div>
    <div class="stats">${stats}</div>
    ${bars(d)}
    <div class="practice">${recs}${prac}</div>
    ${table}
  </div>`;
}

/* ---- plain-text version for email / clipboard ------------------------ */
function textReport(all){
  const lines = ['ARCADE PROGRESS — ' + new Date().toLocaleDateString(), ''];
  for (const d of all){
    lines.push(`${d.kid.who.toUpperCase()} (${d.kid.game})`);
    if (!d.sessions.length){ lines.push('  No finished games yet.', ''); continue; }
    lines.push(`  Accuracy, last ${Math.min(RECENT_N,d.sessions.length)}: ${Math.round(d.recentAcc)}%`
      + (d.priorAcc !== null ? ` (was ${Math.round(d.priorAcc)}%)` : ''));
    lines.push(`  Sessions: ${d.sessions.length}   Questions: ${d.totalQ}   Last played: ${fullDate(d.last)}`);
    lines.push(`  Facts mastered: ${d.mastered}   Comebacks: ${d.comebacks}`);
    if (d.records.length) lines.push('  Bests: ' + d.records.map(r=>`${r.label} ${r.value}`).join(' | '));
    lines.push('  Working on: ' + (d.practice.length
      ? d.practice.map(p=>`${prettyFact(p.id)} (${p.misses})`).join(', ')
      : 'nothing — practice list is clear'));
    lines.push('');
  }
  lines.push('Sent from the Arcade parent report.');
  return lines.join('\n');
}

/* ---- go -------------------------------------------------------------- */
const all = KIDS.map(summarise);
const played = all.filter(d => d.sessions.length);
document.getElementById('report').innerHTML = all.map(card).join('');
document.getElementById('sub').textContent = played.length
  ? `${played.length === 2 ? 'Both boys' : played[0].kid.who} have played ${sessions.length} recorded session${sessions.length===1?'':'s'} on this browser.`
  : 'Nothing recorded yet on this browser.';

const text = textReport(all);
document.getElementById('emailBtn').onclick = () => {
  const subject = 'Arcade progress — ' + new Date().toLocaleDateString();
  window.location.href = `mailto:${PARENT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(text)}`;
};
document.getElementById('copyBtn').onclick = async (e) => {
  try { await navigator.clipboard.writeText(text); }
  catch(err){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(e2){}
    ta.remove();
  }
  e.target.textContent = 'Copied!';
  setTimeout(()=>{ e.target.textContent = 'Copy as text'; }, 1600);
};
document.getElementById('printBtn').onclick = () => window.print();
document.getElementById('note').innerHTML =
  `Everything here is stored in this browser only — nothing is uploaded anywhere. ` +
  `<b>Email this to me</b> opens your mail app with the report already written out to ` +
  `${PARENT_EMAIL}; you still press send. If the boys play in different browsers or ` +
  `profiles, each one keeps its own separate history.`;

/* ---- hover tooltips on the bars -------------------------------------- */
const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const bar = e.target.closest('.bar');
  if (!bar) return;
  tip.textContent = bar.dataset.tip;
  tip.style.whiteSpace = 'pre-line';
  tip.style.opacity = '1';
});
document.addEventListener('mousemove', e => {
  if (tip.style.opacity !== '1') return;
  const pad = 14;
  tip.style.left = Math.min(e.clientX + pad, window.innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top  = Math.max(8, e.clientY - tip.offsetHeight - pad) + 'px';
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.bar')) tip.style.opacity = '0';
});
</script>
</body>
</html>
