<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coin Climb</title>
<style>
  :root{
    --sky-top:#5cc9f5;
    --sky-bottom:#a8e6ff;
    --panel:#241640;
    --ink:#2a1a05;
    --cream:#fff6e0;
    --accent:#ffd23f;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden;
    background:linear-gradient(180deg,var(--sky-top),var(--sky-bottom));
    font-family:'Trebuchet MS','Arial Rounded MT Bold',sans-serif;
    color:var(--ink); touch-action:manipulation; user-select:none;
  }
  #wrap{ position:relative; width:100vw; height:100vh; display:flex; flex-direction:column; align-items:center; }

  #topbar{
    width:100%; max-width:600px; display:flex; justify-content:space-between; align-items:center;
    padding:8px 14px; font-weight:900; font-size:18px; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,0.35);
  }
  #topbar .cell{ text-align:center; min-width:66px; }
  #topbar .label{ opacity:0.85; font-weight:700; font-size:11px; display:block; letter-spacing:1px; }
  #best{ color:#fff2a8; }

  canvas#game{
    background:#8ad8ff;
    border-radius:16px;
    box-shadow:0 0 0 5px #fff6e0, 0 10px 26px rgba(0,0,0,0.25);
    width:min(94vw,600px); max-height:34vh;
    image-rendering:pixelated;
  }

  #question{
    background:var(--cream); border-radius:18px; box-shadow:0 6px 0 #d9c69a;
    padding:12px 26px; margin:auto 0 6px;
    font-size:clamp(30px,9vw,48px); font-weight:900; letter-spacing:2px;
    min-width:min(90vw,320px); text-align:center;
  }
  #qHint{ font-size:14px; font-weight:800; color:#4a6b1f; height:20px; margin-bottom:8px; }

  #choices{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px;
    width:min(94vw,520px); padding:0 6px 14px; margin-bottom:auto;
  }
  .choice{
    border:none; border-radius:20px; padding:20px 0;
    font-family:inherit; font-weight:900; font-size:clamp(26px,7vw,38px);
    background:linear-gradient(180deg,#ffe27a,#ffb800); color:#4a3000;
    box-shadow:0 7px 0 #c98700; cursor:pointer;
  }
  .choice:active{ box-shadow:0 3px 0 #c98700; transform:translateY(4px); }
  .choice.right{ background:linear-gradient(180deg,#9cf07f,#3fb96f); color:#08331a; box-shadow:0 7px 0 #1c7a45; }
  .choice.wrong{ background:linear-gradient(180deg,#ffa896,#e35a5a); color:#4a0d0d; box-shadow:0 7px 0 #9c1f1f; }
  .choice[disabled]{ cursor:default; }

  .overlay{
    position:absolute; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:20px 18px;
    background:linear-gradient(180deg,#5cc9f5,#3c8fd6); overflow-y:auto;
  }
  .overlay h1{ font-size:clamp(30px,8vw,44px); margin:0 0 4px; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,0.28); }
  .overlay h2{ font-size:28px; margin:0 0 8px; color:#fff; text-shadow:0 3px 0 rgba(0,0,0,0.28); }
  .overlay p{ color:#eaf8ff; margin:0 0 14px; font-size:15px; max-width:400px; line-height:1.5; font-weight:600; }
  .btn{
    background:linear-gradient(180deg,#ffe27a,#ffb800); color:#4a3000;
    border:none; padding:16px 38px; border-radius:999px;
    font-family:inherit; font-weight:900; font-size:20px;
    box-shadow:0 6px 0 #c98700; cursor:pointer; margin:6px;
  }
  .btn:active{ box-shadow:0 3px 0 #c98700; transform:translateY(3px); }
  .btn.ghost{
    background:rgba(255,255,255,0.22); color:#fff; box-shadow:0 5px 0 rgba(0,0,0,0.18);
    font-size:14px; padding:11px 22px;
  }
  .chooser{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:6px; }
  .chip{
    border:none; border-radius:999px; padding:12px 22px; cursor:pointer;
    font-family:inherit; font-weight:900; font-size:15px;
    background:rgba(255,255,255,0.25); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .chip.on{ background:var(--cream); color:#2a1a05; box-shadow:0 4px 0 #d9c69a; }
  .sectionLabel{ font-size:12px; letter-spacing:2px; color:#eaf8ff; font-weight:900; margin:16px 0 8px; }

  .scoreRow{ font-size:19px; margin:4px 0; color:#fff; font-weight:800; }
  .scoreRow b{ color:#fff2a8; font-size:26px; }
  #newRecord{ color:#fff2a8; font-size:24px; font-weight:900; margin:10px 0; }
  .recordBoard{
    background:var(--cream); border-radius:18px; padding:14px 22px; margin:12px 0;
    min-width:265px; box-shadow:0 6px 0 #d9c69a; color:#2a1a05;
  }
  .recordBoard div{ display:flex; justify-content:space-between; gap:20px; font-size:15px; padding:3px 0; font-weight:800; }
  .recordBoard span:last-child{ color:#c07800; }
  .hidden{ display:none !important; }
  a.back{ position:absolute; top:10px; left:14px; color:#fff; text-decoration:none; font-size:13px; font-weight:900; z-index:20; text-shadow:0 2px 0 rgba(0,0,0,0.3); }
</style>
</head>
<body>
<div id="wrap">
  <a class="back" href="../index.html">&larr; Arcade</a>

  <div id="topbar">
    <div class="cell"><span class="label" id="mainLabel">TIME</span><span id="mainValue">0.0</span></div>
    <div class="cell"><span class="label">COINS</span><span id="coinValue">0</span></div>
    <div class="cell"><span class="label">STREAK</span><span id="streakValue">0</span></div>
    <div class="cell"><span class="label">BEST</span><span id="best">—</span></div>
  </div>

  <canvas id="game" width="600" height="280"></canvas>

  <div id="question">3 + 4 = ?</div>
  <div id="qHint"></div>
  <div id="choices"></div>

  <!-- ================= START SCREEN ================= -->
  <div class="overlay" id="startScreen">
    <h1>🪙 Coin Climb</h1>
    <p>Every answer you get right gives you a jump and a coin. Climb all the way to the flag!</p>

    <div class="sectionLabel">PICK YOUR MATH</div>
    <div class="chooser" id="topicChooser">
      <button class="chip on" data-topic="addsub">➕ Add &amp; Subtract</button>
      <button class="chip" data-topic="count">🔢 Count &amp; Compare</button>
    </div>

    <div class="sectionLabel">PICK YOUR GAME</div>
    <div class="chooser" id="modeChooser">
      <button class="chip on" data-mode="sprint">🏁 Race to the Flag</button>
      <button class="chip" data-mode="blitz">🪙 Coin Rush (60s)</button>
    </div>

    <div class="recordBoard" id="recordBoard"></div>
    <button class="btn" id="startBtn">PLAY!</button>
    <button class="btn ghost" id="resetBtn">Clear my records</button>
  </div>

  <!-- ================= END SCREEN ================= -->
  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">You made it!</h2>
    <div id="newRecord" class="hidden">⭐ NEW RECORD! ⭐</div>
    <div id="endStats"></div>
    <div class="recordBoard" id="endBoard"></div>
    <button class="btn" id="againBtn">PLAY AGAIN</button>
    <button class="btn ghost" id="menuBtn">Change game</button>
  </div>
</div>

<script>
/* =====================================================================
   COIN CLIMB — tweak anything in here
   ===================================================================== */
const CONFIG = {
  climbSteps:    15,    // how many right answers to reach the flag
  blitzSeconds:  60,    // how long Coin Rush lasts
  wrongPause:    900,   // ms the right answer stays highlighted after a miss
};

/* ---------------- storage --------------------------------------------- */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const KEY = (t,m)=>`coinclimb.v1.${t}.${m}`;
const TOPIC_NAME = { addsub:'Add & Subtract', count:'Count & Compare' };
const MODE_NAME  = { sprint:'Race', blitz:'Coin Rush' };

const getBest = (t,m)=>{ const r = store.get(KEY(t,m)); return r===null?null:parseFloat(r); };
function saveBest(t,m,v){
  const cur = getBest(t,m);
  const better = cur===null || (m==='sprint' ? v<cur : v>cur);
  if (better){ store.set(KEY(t,m), String(v)); return true; }
  return false;
}
const fmtTime = s=>s.toFixed(1)+'s';
const fmtBest = (m,v)=> v===null ? '—' : (m==='sprint' ? fmtTime(v) : v+' coins');

/* ---------------- sound ------------------------------------------------ */
let actx = null;
function beep(freq,dur,type='square',vol=0.13){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const sfx = {
  coin(){ beep(988,0.07); setTimeout(()=>beep(1319,0.16),70); },   // classic two-note coin
  jump(){ beep(440,0.06,'square',0.09); setTimeout(()=>beep(660,0.07,'square',0.08),50); },
  oops(){ beep(300,0.14,'triangle',0.10); setTimeout(()=>beep(220,0.18,'triangle',0.09),110); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,0.17,'square',0.14), i*110)); },
  done(){ [784,659,523].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'square',0.12), i*140)); }
};

/* ---------------- question generation ---------------------------------- */
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];

function makeQuestion(topic){
  if (topic === 'addsub'){
    if (Math.random() < 0.5){
      const a = 1+rnd(12), b = 1+rnd(20-a);              // sums stay within 20
      return { text:`${a} + ${b} = ?`, answer:a+b, hint:'' };
    }
    const a = 5+rnd(16), b = 1+rnd(a-1);                  // never goes below zero
    return { text:`${a} − ${b} = ?`, answer:a-b, hint:'' };
  }

  // ---- count & compare ----
  const kind = pick(['skip','skip','bigger','smaller','next']);
  if (kind === 'skip'){
    const step = pick([2,5,10]);
    const start = step * (1+rnd(4));
    const seq = [start, start+step, start+step*2, start+step*3];
    return { text:`${seq[0]}, ${seq[1]}, ${seq[2]}, ?`, answer:seq[3], hint:`counting by ${step}s` };
  }
  if (kind === 'next'){
    const n = 10+rnd(80);
    if (Math.random()<0.5) return { text:`What comes after ${n}?`, answer:n+1, hint:'' };
    return { text:`What comes before ${n}?`, answer:n-1, hint:'' };
  }
  // three distinct numbers — the choices ARE the question here, so build all
  // three on purpose. (If we only forced two, the filler distractor could end
  // up bigger than the "biggest", which would make the right answer look wrong.)
  const nums = [];
  while (nums.length < 3){
    const n = 1+rnd(60);
    if (!nums.includes(n)) nums.push(n);
  }
  if (kind === 'bigger') return { text:'Which is BIGGEST?', answer:Math.max(...nums), hint:'', forced:nums };
  return { text:'Which is SMALLEST?', answer:Math.min(...nums), hint:'', forced:nums };
}

function makeChoices(q){
  const ans = q.answer;
  const set = new Set([ans]);
  if (q.forced){ q.forced.forEach(v=>set.add(v)); }
  const nudges = [1,-1,2,-2,10,-10,5,-5];
  let guard = 0;
  while (set.size < 3 && guard++ < 60){
    const v = ans + pick(nudges);
    if (v >= 0) set.add(v);
  }
  while (set.size < 3) set.add(rnd(40)+1);
  const arr = [...set].slice(0,3);
  // shuffle
  for (let i=arr.length-1;i>0;i--){ const j=rnd(i+1); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

/* ---------------- pixel hero ------------------------------------------- */
// 1 hat/shirt red, 2 skin, 3 overalls blue, 4 shoes brown, 5 eyes/dark
const HERO = [
  "0011110",
  "0111111",
  "0522250",
  "0525250",
  "0222220",
  "0113110",
  "1113111",
  "1333331",
  "1333331",
  "0333330",
  "0330330",
  "0440440"
];
const HERO_COLORS = { '1':'#e33e3e','2':'#ffc9a0','3':'#3f6fd8','4':'#7a4a1e','5':'#2a1a05','0':null };

/* ---------------- game state -------------------------------------------- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;
const BASE_Y = H - 26;          // ground line
const STEP_H = 13;              // how far up the hero appears to move per step
const HERO_X = 130;

let state='menu', topic='addsub', mode='sprint';
let coins, wrong, streak, bestStreak, elapsed, climb, locked;
let q=null, choices=[], sparkles=[], flyCoins=[], heroY=0, heroTargetY=0, heroSquash=0;
let lastT=0, camOffset=0, camTarget=0;

function resetGame(){
  coins=0; wrong=0; streak=0; bestStreak=0; elapsed=0; climb=0; locked=false;
  sparkles=[]; flyCoins=[];
  heroY=0; heroTargetY=0; heroSquash=0; camOffset=0; camTarget=0;
  nextQuestion();
}
function nextQuestion(){
  q = makeQuestion(topic);
  choices = makeChoices(q);
  document.getElementById('question').textContent = q.text;
  document.getElementById('qHint').textContent = q.hint || '';
  renderChoices();
  locked = false;
}
function renderChoices(){
  const box = document.getElementById('choices');
  box.innerHTML = '';
  choices.forEach(v=>{
    const b = document.createElement('button');
    b.className='choice'; b.textContent=v; b.dataset.value=v;
    b.onclick = ()=>answer(v,b);
    box.appendChild(b);
  });
}

/* ---------------- answering ---------------------------------------------- */
function answer(value, btn){
  if (state!=='playing' || locked) return;
  if (value === q.answer){
    locked = true;
    btn.classList.add('right');
    coins++; streak++; climb++;
    if (streak>bestStreak) bestStreak=streak;
    sfx.coin(); sfx.jump();
    heroTargetY += STEP_H; heroSquash = 1;
    camTarget = Math.max(0, heroTargetY - 60);
    burst();
    flyCoins.push({ x:HERO_X, y:BASE_Y-heroY-70, t:0 });
    updateHUD();
    if (mode==='sprint' && climb >= CONFIG.climbSteps) return setTimeout(()=>endGame(true), 420);
    setTimeout(nextQuestion, 230);
  } else {
    locked = true;
    wrong++; streak = 0;
    sfx.oops();
    btn.classList.add('wrong');
    // show which one was right — no penalty, just teach it
    [...document.querySelectorAll('.choice')].forEach(b=>{
      b.disabled = true;
      if (parseInt(b.dataset.value,10) === q.answer) b.classList.add('right');
    });
    document.getElementById('qHint').textContent = `The answer is ${q.answer}`;
    updateHUD();
    setTimeout(nextQuestion, CONFIG.wrongPause);
  }
}
function burst(){
  for (let i=0;i<16;i++){
    sparkles.push({
      x:HERO_X, y:BASE_Y-heroY-40,
      vx:(Math.random()-0.5)*180, vy:-Math.random()*160-40,
      life:0.5+Math.random()*0.3, max:0.8, size:3+rnd(3),
      color: pick(['#ffd23f','#fff6cf','#ffb800'])
    });
  }
}

/* ---------------- loop ---------------------------------------------------- */
function loop(t){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05,(t-lastT)/1000 || 0);
  lastT = t;
  if (state==='playing'){
    elapsed += dt;
    if (mode==='blitz' && elapsed >= CONFIG.blitzSeconds) return endGame(true);
    updateHUD();
  }
  // smooth the hop and the camera
  heroY += (heroTargetY - heroY) * Math.min(1, dt*11);
  camOffset += (camTarget - camOffset) * Math.min(1, dt*6);
  if (heroSquash>0) heroSquash = Math.max(0, heroSquash - dt*4);

  for (let i=sparkles.length-1;i>=0;i--){
    const p=sparkles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=520*dt; p.life-=dt;
    if(p.life<=0) sparkles.splice(i,1);
  }
  for (let i=flyCoins.length-1;i>=0;i--){
    flyCoins[i].t += dt;
    if (flyCoins[i].t > 0.7) flyCoins.splice(i,1);
  }
  draw();
}
function updateHUD(){
  document.getElementById('mainValue').textContent =
    mode==='sprint' ? elapsed.toFixed(1) : Math.max(0, Math.ceil(CONFIG.blitzSeconds-elapsed));
  document.getElementById('coinValue').textContent = coins;
  document.getElementById('streakValue').textContent = streak;
}

/* ---------------- drawing -------------------------------------------------- */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }

function drawCloud(x,y,s){
  ctx.fillStyle='#ffffff';
  px(x,y,20*s,8*s,'#ffffff');
  px(x+6*s,y-6*s,10*s,8*s,'#ffffff');
  px(x+14*s,y-3*s,10*s,7*s,'#ffffff');
}
function drawCoinSprite(x,y,s){
  px(x-3*s,y-4*s,6*s,8*s,'#ffd23f');
  px(x-1*s,y-4*s,2*s,8*s,'#fff6cf');
  px(x-3*s,y-4*s,6*s,1*s,'#c98700');
  px(x-3*s,y+3*s,6*s,1*s,'#c98700');
}
function drawHero(x,y){
  const s = 3;
  const squash = heroSquash*3;
  const ox = x - (7*s)/2;
  const oy = y - HERO.length*s + squash;
  for (let r=0;r<HERO.length;r++){
    for (let c=0;c<HERO[r].length;c++){
      const col = HERO_COLORS[HERO[r][c]];
      if (col) px(ox+c*s, oy+r*s, s+0.5, s+0.5, col);
    }
  }
}
function draw(){
  // sky
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#5cc9f5'); g.addColorStop(1,'#bdefff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // parallax clouds
  const cl = (camOffset*0.3) % 260;
  drawCloud(60+cl*0.1, 40, 2); drawCloud(300-cl*0.15, 26, 1.6); drawCloud(470+cl*0.05, 58, 2.2);

  ctx.save();
  ctx.translate(0, camOffset);

  // ground
  px(0, BASE_Y, W, H-BASE_Y+300, '#c98a4a');
  px(0, BASE_Y, W, 6, '#4fbf5a');

  // the tower of blocks the hero has climbed
  for (let i=0;i<CONFIG.climbSteps;i++){
    const by = BASE_Y - (i+1)*STEP_H;
    const done = i < climb;
    const bx = HERO_X - 26;
    px(bx, by, 52, STEP_H-2, done ? '#e0a24a' : 'rgba(255,255,255,0.30)');
    if (done){
      px(bx, by, 52, 2, '#f7c98a');
      px(bx+4, by+4, 4, 4, '#a8712e'); px(bx+44, by+4, 4, 4, '#a8712e');
    }
  }

  // flag at the top
  const flagY = BASE_Y - CONFIG.climbSteps*STEP_H - 4;
  px(HERO_X+22, flagY-46, 3, 50, '#8a8a8a');
  px(HERO_X+25, flagY-46, 26, 16, climb>=CONFIG.climbSteps ? '#4fbf5a' : '#e33e3e');
  px(HERO_X+18, flagY-52, 11, 8, '#ffd23f');

  // floating coins above the next few blocks
  for (let i=climb;i<Math.min(climb+3, CONFIG.climbSteps);i++){
    const cy = BASE_Y - (i+1)*STEP_H - 9 + Math.sin(Date.now()/300 + i)*2;
    const cx = HERO_X + 58 + ((i-climb)%2 ? 26 : 0);   // zig-zag so they don't stack into a stick
    drawCoinSprite(cx, cy, 2.2);
  }

  drawHero(HERO_X, BASE_Y - heroY);

  flyCoins.forEach(fc=>{
    const p = fc.t/0.7;
    ctx.globalAlpha = 1-p;
    drawCoinSprite(fc.x, fc.y - p*46, 2);
    ctx.globalAlpha = 1;
  });
  sparkles.forEach(p=>{
    ctx.globalAlpha = Math.max(0,p.life/p.max);
    px(p.x,p.y,p.size,p.size,p.color);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ---------------- start / end ---------------------------------------------- */
function renderRecordBoard(el){
  const rows = [];
  for (const t of ['addsub','count'])
    for (const m of ['sprint','blitz'])
      rows.push(`<div><span>${TOPIC_NAME[t]} · ${MODE_NAME[m]}</span><span>${fmtBest(m,getBest(t,m))}</span></div>`);
  el.innerHTML = `<div style="opacity:.55;font-size:11px;letter-spacing:1.5px;justify-content:center">YOUR RECORDS</div>` + rows.join('');
}
function refreshBestLabel(){
  document.getElementById('best').textContent = fmtBest(mode,getBest(topic,mode));
  document.getElementById('mainLabel').textContent = mode==='sprint' ? 'TIME' : 'LEFT';
}
function startGame(){
  state='playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  refreshBestLabel(); resetGame(); updateHUD();
  beep(523,0.1); setTimeout(()=>beep(784,0.14),110);
}
function endGame(){
  state='over';
  let score, isRecord;
  if (mode==='sprint'){
    score = Math.round(elapsed*10)/10;
    isRecord = saveBest(topic,'sprint',score);
    document.getElementById('endTitle').textContent = '🚩 YOU REACHED THE FLAG!';
  } else {
    score = coins;
    isRecord = saveBest(topic,'blitz',score);
    document.getElementById('endTitle').textContent = "⏰ TIME'S UP!";
  }
  sfx.win();
  const acc = (coins+wrong) ? Math.round(coins/(coins+wrong)*100) : 0;
  const stats = [];
  if (mode==='sprint') stats.push(`<div class="scoreRow">Your time: <b>${fmtTime(elapsed)}</b></div>`);
  stats.push(`<div class="scoreRow">Coins: <b>${coins}</b> 🪙</div>`);
  stats.push(`<div class="scoreRow">Best streak: <b>${bestStreak}</b> · ${acc}% right</div>`);
  document.getElementById('endStats').innerHTML = stats.join('');
  document.getElementById('newRecord').classList.toggle('hidden', !isRecord);
  renderRecordBoard(document.getElementById('endBoard'));
  document.getElementById('endScreen').classList.remove('hidden');
}

/* ---------------- wiring ---------------------------------------------------- */
document.addEventListener('keydown', e=>{
  if (state==='playing' && ['1','2','3'].includes(e.key)){
    const btns = document.querySelectorAll('.choice');
    const b = btns[parseInt(e.key,10)-1];
    if (b && !b.disabled) b.click();
  } else if (e.key==='Enter' && state!=='playing'){ startGame(); }
});
document.querySelectorAll('#topicChooser .chip').forEach(c=>{
  c.onclick=()=>{ document.querySelectorAll('#topicChooser .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); topic=c.dataset.topic; refreshBestLabel(); };
});
document.querySelectorAll('#modeChooser .chip').forEach(c=>{
  c.onclick=()=>{ document.querySelectorAll('#modeChooser .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on'); mode=c.dataset.mode; refreshBestLabel(); };
});
document.getElementById('startBtn').onclick = startGame;
document.getElementById('againBtn').onclick = startGame;
document.getElementById('menuBtn').onclick = ()=>{
  state='menu';
  document.getElementById('endScreen').classList.add('hidden');
  renderRecordBoard(document.getElementById('recordBoard'));
  document.getElementById('startScreen').classList.remove('hidden');
};
document.getElementById('resetBtn').onclick = ()=>{
  ['addsub','count'].forEach(t=>['sprint','blitz'].forEach(m=>store.del(KEY(t,m))));
  renderRecordBoard(document.getElementById('recordBoard'));
  refreshBestLabel();
};

renderRecordBoard(document.getElementById('recordBoard'));
refreshBestLabel();
resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
